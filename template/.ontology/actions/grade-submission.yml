action: GradeSubmission
domain: "education"
tags: ["assignment", "grading"]
description: "강사가 학생의 과제 제출물을 검토하고 점수와 피드백을 부여한다."

actor:
  type: User
  role: "INSTRUCTOR"
  permission: "assignment:grade"

target:
  object: AssignmentSubmission
  lookup: "id"

parameters:
  score:
    type: integer
    range: [0, 100]
    required: true
    description: "0점에서 100점 사이의 채점 점수"
  feedback:
    type: text
    max_length: 2000
    required: false
    description: "학생에게 전달할 피드백 코멘트"

# 비즈니스 가드레일 (실행 전 불변식 검증)
preconditions:
  - id: "SUBMISSION_STATE_VALID"
    rule: "target.status in ['SUBMITTED', 'RESUBMITTED']"
    error: "제출 완료 상태의 과제만 채점할 수 있습니다."
  - id: "INSTRUCTOR_AUTHORIZED"
    rule: "actor.id == target.course.instructor_id"
    error: "해당 코스의 담당 강사만 채점할 수 있습니다."

# 상태 전이 및 이벤트 부수 효과
effects:
  mutate:
    target.status: "GRADED"
    target.score: "params.score"
    target.feedback: "params.feedback"
    target.graded_at: "now()"
  events:
    - name: "ASSIGNMENT_GRADED"
      channel: "notification"
      recipient: "target.student_id"

# 실제 코드베이스 바인딩
code_binding:
  backend:
    service: "backend/app/services/assignment_service.py:grade_submission"
    api: "POST /api/v1/courses/{course_id}/submissions/{submission_id}/grade"
  frontend:
    feature: "frontend/src/features/grading"
  mobile:
    viewmodel: "mobile/lib/features/assignment/viewmodels/grading_viewmodel.dart"

governance:
  feature_id: "F52"
  adr: "docs/adr/0008-course-grading-policy.md"
  tech_debt: null
